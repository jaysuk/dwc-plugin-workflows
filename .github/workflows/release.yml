name: DWC plugin release

# Reusable release workflow for DuetWebControl (Vue 3) plugins. One copy, used by every plugin: when it
# changes here, every plugin picks it up on its next release.
#
# In a plugin repo, .github/workflows/release.yml is just:
#
#   name: Release
#   on:
#     push: { tags: ["v*"] }
#     workflow_dispatch:
#       inputs:
#         dwc-ref: { description: DuetWebControl branch/tag/sha to build against, default: v3.7-dev }
#   permissions:
#     contents: write
#   jobs:
#     release:
#       uses: jaysuk/dwc-plugin-workflows/.github/workflows/release.yml@v1
#       with:
#         dwc-ref: ${{ inputs.dwc-ref }}
#
# On a version tag: build the installable ZIP(s) against DWC, then publish a GitHub Release with a
# pun title (scripts/release-titles.txt), notes and an install footer. The notes are the version's CHANGELOG.md
# section when there is one (draft it with scripts/draft-release-notes.mjs), else a Conventional-Commit list.
# On a manual run: build the same ZIP(s), upload them as an artifact, and print the title and notes it
# WOULD have published to the run summary - a dry run, nothing is published.
#
# What a plugin must provide: plugin.json (id/version/dwcVersion), package.json with `typecheck` and
# `verify-build` scripts, and scripts/release-titles.txt. Optional: .github/release-footer.md (extra
# notes appended to the footer), CHANGELOG.md (a section for the version beats the generated notes),
# a `release:prepare` npm script (run before packaging, e.g. to fetch a bundled asset), and for a dual
# 3.7+3.6 package `dwc36: true` plus scripts/stage-dwc36.mjs.

on:
  workflow_call:
    inputs:
      dwc-ref:
        description: DuetWebControl branch/tag/sha for the DWC 3.7 package (empty = v3.7-dev).
        type: string
        default: ""
      dwc36:
        description: Also build a DWC 3.6 package (needs scripts/stage-dwc36.mjs; skipped while src/ui36 is absent).
        type: boolean
        default: false
      dwc36-ref:
        description: DuetWebControl branch/tag/sha for the DWC 3.6 package (empty = v3.6-dev).
        type: string
        default: ""
      node-version:
        type: string
        default: "26"
      workflows-ref:
        description: Ref of dwc-plugin-workflows to take the shared scripts from. Keep it equal to the ref in `uses:`.
        type: string
        default: v1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release and upload the assets
    env:
      DWC_REF: ${{ inputs.dwc-ref || 'v3.7-dev' }}
      DWC36_REF: ${{ inputs.dwc36-ref || 'v3.6-dev' }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          fetch-depth: 0 # full history + tags so the changelog generator and title picker see every tag
          fetch-tags: true

      - name: Checkout shared release scripts
        uses: actions/checkout@v6
        with:
          repository: jaysuk/dwc-plugin-workflows
          ref: ${{ inputs.workflows-ref }}
          path: workflows

      - name: Checkout DuetWebControl
        uses: actions/checkout@v6
        with:
          repository: Duet3D/DuetWebControl
          ref: ${{ env.DWC_REF }}
          path: DuetWebControl

      - uses: actions/setup-node@v6
        with: { node-version: "${{ inputs.node-version }}" }

      - name: Read plugin manifest
        id: meta
        working-directory: plugin
        run: |
          echo "id=$(node -p "require('./plugin.json').id")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./plugin.json').version")" >> "$GITHUB_OUTPUT"

      # Record exactly which DWC the ZIP is built against, for the release notes.
      - name: Capture DuetWebControl build info
        id: dwc
        run: |
          echo "version=$(node -p "require('./DuetWebControl/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C DuetWebControl rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The tag must match the version stamped into the ZIP/manifest, so a release can't ship a
      # mismatched build.
      - name: Verify tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: plugin
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./plugin.json').version")
          if [ "$VER" != "$TAG" ]; then
            echo "::error::Tag '$TAG' != plugin.json version '$VER'. Bump plugin.json + package.json and re-tag."
            exit 1
          fi
          if [ -f package.json ]; then
            PKG=$(node -p "require('./package.json').version")
            if [ "$PKG" != "$TAG" ]; then
              echo "::error::Tag '$TAG' != package.json version '$PKG'. Bump plugin.json + package.json and re-tag."
              exit 1
            fi
          fi

      - name: Install DuetWebControl
        working-directory: DuetWebControl
        run: npm install

      - name: Install plugin (and its bundled deps into DWC)
        working-directory: plugin
        run: |
          npm install
          # Install the plugin's runtime dependencies into DWC with their exact specs (github: specs
          # used verbatim, registry specs as name@range) so the build/type-check can resolve them.
          SPECS=$(node -p "Object.entries(require('./package.json').dependencies||{}).map(([k,v])=>/[:\\/]/.test(v)?v:k+'@'+v).join(' ')")
          if [ -n "$SPECS" ]; then (cd ../DuetWebControl && npm install --no-save $SPECS); fi

      - name: Type-check against DWC
        working-directory: plugin
        env:
          DWC_DIR: ${{ github.workspace }}/DuetWebControl
        run: npm run typecheck

      # Optional hook: a plugin that must fetch/generate assets before packaging (and only for releases,
      # not CI) defines a `release:prepare` npm script.
      - name: Prepare release assets
        working-directory: plugin
        run: |
          if [ "$(node -p "!!(require('./package.json').scripts||{})['release:prepare']")" = "true" ]; then
            npm run release:prepare
          fi

      - name: Build installable ZIP
        working-directory: plugin
        env:
          DWC_DIR: ${{ github.workspace }}/DuetWebControl
        run: npm run verify-build

      # The DWC packager also emits <id>-<version>-srcmap.zip; only the plugin ZIP should be released.
      - name: Drop source-map ZIP
        working-directory: plugin
        run: rm -f "${{ steps.meta.outputs.id }}"-*-srcmap.zip

      # ── DWC 3.6 package (opt-in) ─────────────────────────────────────────────
      # A second, separate ZIP: 3.6 is Vue 2.7 / Vuetify 2 / Vuex, so it is a different bundle built from
      # src/ui36 against a different DWC checkout. Both ship in the same release; the in-app update checker
      # picks the right one per generation. Guarded on src/ui36 existing so a plugin can opt in before its
      # 3.6 UI lands without breaking releases.
      - name: Check for DWC 3.6 UI
        id: has36
        if: inputs.dwc36
        working-directory: plugin
        run: echo "present=$( [ -d src/ui36 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Checkout DuetWebControl 3.6
        if: steps.has36.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          repository: Duet3D/DuetWebControl
          ref: ${{ env.DWC36_REF }}
          path: DuetWebControl36

      - name: Install DuetWebControl 3.6
        if: steps.has36.outputs.present == 'true'
        working-directory: DuetWebControl36
        run: npm install

      # No dependency install into the 3.6 checkout: scripts/stage-dwc36.mjs vendors what the 3.6 bundle
      # needs into the staged tree instead (DWC 3.6 ships older versions of some libraries, and installing
      # newer ones over them would break DWC's own UI).
      - name: Build installable ZIP (DWC 3.6)
        id: build36
        if: steps.has36.outputs.present == 'true'
        working-directory: plugin
        env:
          PLUGIN_ID: ${{ steps.meta.outputs.id }}
        run: |
          node scripts/stage-dwc36.mjs "$RUNNER_TEMP/$PLUGIN_ID-dwc36"
          (cd ../DuetWebControl36 && npm run build-plugin-pkg -- "$RUNNER_TEMP/$PLUGIN_ID-dwc36")
          # Exclude -srcmap.zip explicitly: it sorts BEFORE the real package ("-" < "."), so a bare
          # `head -1` would publish a sourcemap archive as the 3.6 plugin the day DWC 3.6 starts emitting one.
          ZIP=$(ls ../DuetWebControl36/dist/"$PLUGIN_ID"-*.zip 2>/dev/null | grep -v -- '-srcmap\.zip$' | head -1)
          if [ -z "$ZIP" ]; then echo "::error::DWC 3.6 build produced no ZIP"; exit 1; fi
          mv "$ZIP" "./$(basename "${ZIP%.zip}")-dwc36.zip"
          ls -la "$PLUGIN_ID"-*.zip
          echo "dwc36_version=$(node -p "require('../DuetWebControl36/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "dwc36_sha=$(git -C ../DuetWebControl36 rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Notes and title are generated on manual runs too (shown in the run summary) so a dry run exercises
      # exactly what a tag push will publish.
      - name: Generate release notes
        working-directory: plugin
        env:
          PLUGIN_VERSION: ${{ steps.meta.outputs.version }}
          DWC_VERSION: ${{ steps.dwc.outputs.version }}
          DWC_SHA: ${{ steps.dwc.outputs.sha }}
          DWC36_VERSION: ${{ steps.build36.outputs.dwc36_version }}
          DWC36_SHA: ${{ steps.build36.outputs.dwc36_sha }}
        # With a CHANGELOG.md section for the version: that section, the install footer, then the generated
        # commit list collapsed. Without one: the generated list, then the footer (see release-notes.mjs).
        run: node ../workflows/scripts/release-notes.mjs --version "v$PLUGIN_VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Resolve release title
        id: title
        working-directory: plugin
        env:
          PLUGIN_VERSION: ${{ steps.meta.outputs.version }}
        run: echo "name=$(node ../workflows/scripts/release-title.mjs "v$PLUGIN_VERSION")" >> "$GITHUB_OUTPUT"

      - name: Show what would be released (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "## ${{ steps.title.outputs.name }}"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Release with the ZIP(s) (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          name: ${{ steps.title.outputs.name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: plugin/${{ steps.meta.outputs.id }}-*.zip

      - name: Upload ZIP(s) as an artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.id }}-plugin
          path: plugin/${{ steps.meta.outputs.id }}-*.zip
